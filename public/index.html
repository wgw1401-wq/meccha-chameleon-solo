<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>COLOR HIDE — 3D 색상 숨바꼭질</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <canvas id="gameCanvas"></canvas>

    <header class="brand"><span class="mark"></span><b>COLOR HIDE</b><small>ONLINE 3D</small></header>
    <section id="hud" class="hud hidden">
      <div><span id="phaseLabel">준비 시간</span><strong id="timer">00:30</strong></div>
      <div><span>생존자</span><strong id="survivors">0 / 0</strong></div>
      <div><span>내 역할</span><strong id="role">숨는 팀</strong></div>
      <div class="room-chip">ROOM <b id="hudRoom">-----</b></div>
    </section>
    <div id="crosshair" class="crosshair hidden">+</div>
    <button id="resumeHint" class="resume-hint hidden">화면을 클릭해 시점 조작 계속하기</button>
    <div id="toast" class="toast hidden"></div>

    <section id="colorPanel" class="color-panel hidden">
      <div class="panel-title"><span>CAMO COLOR</span><output id="hexOutput">#6EE7B7</output></div>
      <div id="palette" class="palette"></div>
      <label class="custom-color">직접 선택 <input id="colorInput" type="color" value="#6ee7b7"></label>
      <button id="sampleButton" class="sample-button"><b>E</b> 조준한 표면색 복사</button>
    </section>
    <section class="settings-panel">
      <label for="sensitivityInput">마우스 감도 <output id="sensitivityOutput">1.0</output></label>
      <input id="sensitivityInput" type="range" min="0.2" max="2.5" step="0.1" value="1">
      <small><b>[</b> 낮춤 · <b>]</b> 높임</small>
    </section>

    <section id="menu" class="modal-layer">
      <div class="menu-card">
        <p class="kicker">BLEND · HIDE · SURVIVE</p>
        <h1>COLOR<br><i>HIDE</i></h1>
        <p id="menuDescription" class="description">주변의 색을 훔쳐 숨어라.<br>시선이 닿기 전에 완벽히 섞여라.</p>
        <div id="mainActions" class="actions">
          <button id="soloButton" class="primary">AI와 솔로 플레이 <span>→</span></button>
          <button id="createButton" class="secondary">온라인 방 만들기</button>
          <button id="showJoinButton" class="secondary">방 코드로 참가하기</button>
        </div>
        <div id="joinForm" class="form hidden">
          <input id="nameInput" maxlength="12" value="PLAYER" aria-label="닉네임">
          <input id="roomInput" maxlength="5" placeholder="방 코드" aria-label="방 코드">
          <button id="joinButton" class="primary">입장하기 <span>→</span></button>
          <button id="backButton" class="link">← 돌아가기</button>
        </div>
        <div id="lobby" class="lobby hidden">
          <p>ROOM CODE</p><button id="roomCode" title="클릭하여 복사">-----</button>
          <ul id="playerList"></ul>
          <p id="lobbyHint" class="description"></p>
          <button id="startButton" class="primary hidden">게임 시작 <span>→</span></button>
        </div>
        <p id="statusText" class="status"></p>
      </div>
    </section>

    <footer class="controls"><span><b>WASD</b> 이동</span><span><b>MOUSE</b> 시점</span><span><b>[ / ]</b> 감도</span><span><b>SHIFT</b> 달리기</span><span><b>SPACE</b> 점프</span><span><b>F</b> 공중 고정</span><span><b>E</b> 색 복사</span><span><b>CLICK</b> 사격</span></footer>
  </main>
  <script type="module" src="/game3d.js"></script>
  <script>
    window.addEventListener("error", function (event) {
      if (!event.message && !event.target?.src) return;
      var status = document.getElementById("statusText");
      if (status) status.textContent = "게임 파일을 불러오지 못했습니다. 새로고침해 주세요.";
    }, true);
  </script>
</body>
</html>
